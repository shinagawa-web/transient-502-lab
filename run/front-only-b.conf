# The proxy under test. It pools keepalive connections to the app instances on
# 8081 and 8082. proxy_next_upstream off keeps a failed attempt visible as a
# 502 instead of letting a retry cover it; the retry scenarios override this.
#
# max_fails=0 stops nginx from taking an instance out of rotation after a
# failure, so what is measured is the reuse race and not passive health checks.
worker_processes 4;
daemon off;
master_process on;
error_log /lab/out/baseline-sequential/front-error.log warn;
pid /lab/run/front.pid;
events { worker_connections 1024; }
http {
  log_format lab '$msec $status $request_time $upstream_addr $upstream_status $request';
  access_log /lab/out/baseline-sequential/front-access.log lab;
  upstream backend {

    server 127.0.0.1:8082 max_fails=0;
    keepalive 16;
  }
  server {
    listen 127.0.0.1:8080;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream off;
    }
  }
}
