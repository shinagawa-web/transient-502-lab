# front: pools keepalive connections to the backend.
# proxy_next_upstream back to its default, to see retries hide the 502.
worker_processes 4;
daemon off;
master_process on;
error_log /lab/out/front-error.log warn;
pid /lab/run/front.pid;
events { worker_connections 1024; }
http {
  log_format lab '$msec $status $request_time $upstream_addr $upstream_status $request';
  access_log /lab/out/front-access.log lab;
  upstream backend {
    server 127.0.0.1:8081;
    keepalive 16;
  }
  server {
    listen 127.0.0.1:8080;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # default proxy_next_upstream (error timeout). Non-idempotent methods are not retried
    }
  }
}
