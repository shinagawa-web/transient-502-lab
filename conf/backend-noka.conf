# backend: front からの upstream 先。reload のたびに worker が入れ替わり、
# idle な keepalive 接続に FIN を送る。
worker_processes 2;
daemon off;
master_process on;
error_log /lab/out/backend-error.log warn;
pid /lab/run/backend.pid;
events { worker_connections 1024; }
http {
  access_log /lab/out/backend-access.log combined;
  keepalive_timeout 0;
  keepalive_requests 100000;
  server {
    listen 127.0.0.1:8081;
    location / { return 200 "ok\n"; }
  }
}
