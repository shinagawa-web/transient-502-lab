# backend: the upstream front proxies to. Each reload swaps workers and
# sends FIN on idle keepalive connections.
worker_processes 2;
daemon off;
master_process on;
error_log /lab/out/backend-b-error.log warn;
pid /lab/run/backend-b.pid;
events { worker_connections 1024; }
http {
  access_log /lab/out/backend-b-access.log combined;
  keepalive_timeout 75s;
  keepalive_requests 100000;
  server {
    listen 127.0.0.1:8082;
    location / { return 200 "ok\n"; }
  }
}
