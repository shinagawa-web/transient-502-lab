name: verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'conf/**'
      - 'run.sh'
      - 'Dockerfile'
      - '.github/workflows/verify.yml'

jobs:
  baseline-concurrent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the environment
        run: |
          {
            echo '```'
            uname -srm; nproc; free -h | head -2
            docker version --format 'docker {{.Server.Version}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: docker build -t keepalive-lab .
      - name: Run
        run: |
          docker run --rm --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -v "$PWD":/lab keepalive-lab bash /lab/run.sh baseline-concurrent
          sudo chown -R "$(id -u):$(id -g)" out
      - name: Summarize
        if: always()
        run: |
          {
            echo '```'
            cat out/baseline-concurrent/summary.txt 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate
        run: |
          if [ -f out/baseline-concurrent/loopback.pcap ]; then
            docker run --rm -v "$PWD":/lab keepalive-lab bash -c \
              "tcpdump -r /lab/out/baseline-concurrent/loopback.pcap -n -tt 2>/dev/null > /lab/out/baseline-concurrent/loopback.txt"
            sudo chown -R "$(id -u):$(id -g)" out
          fi
          { echo '```'; python3 tools/analyze.py out/baseline-concurrent; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-concurrent
          path: out/baseline-concurrent
          retention-days: 90

